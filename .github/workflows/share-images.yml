name: Share images

# The preview images for shared links (static/og4) carry the counts, so they are drawn again whenever the data or the
# drawing script changes. The home page's card is a picture of the page's own stage, so any change to the site (static/,
# build/) runs this too: a list of files that matter would be forgotten. Only images whose content changed are committed
# (build/og-hashes.json; the home card is compared by its picture), so most runs commit nothing. Commits by this workflow
# do not start it again (a push by Actions starts no workflow).
on:
  push:
    branches: [main]
    paths: ["data/**", "build/**", "static/**", "!static/og4/**", "!build/og-hashes.json", ".github/workflows/share-images.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: share-images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Font and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          fc-list | grep -i "inter" | head -3
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the site (the home card is a picture of the home page's stage)
        run: python3 build/build.py
      - name: Draw the images that changed
        run: node build/og.js
      - name: What changed (a run on another branch, by hand, only shows this and commits nothing)
        run: git status --short static/og4 build/og-hashes.json
      - name: Commit and deploy if an image changed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "golfvotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A static/og4 build/og-hashes.json
          if git diff --cached --quiet; then echo "no image changed"; else
            git commit -qm "Share images follow the data"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            # a push by this workflow does not start the deploy by itself
            gh workflow run pages.yml --ref main
          fi
