name: Index report

# Asks Google which sitemap URLs are indexed (build/gsc_report.py) and commits the answer to seo/.
# Twice a week: one run may inspect 1,900 URLs (API limit 2,000 a day), two runs cover the whole site.
# Needs the repository secret GSC_SERVICE_ACCOUNT. The script stops asking after 30 minutes and saves what it has. The run fails only on a fault that is new and ours to fix.
on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build the site (for its sitemap)
        run: python3 build/build.py
      - name: Ask Google
        id: ask
        timeout-minutes: 40
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          python3 build/gsc_report.py
      - name: Commit the answers
        if: always() && hashFiles('seo/index_status.json') != ''
        run: |
          git config user.name "golfvotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seo
          git diff --cached --quiet || (git commit -qm "Index report" && git pull -q --rebase && git push -q)
