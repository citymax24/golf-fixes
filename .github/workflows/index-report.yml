name: Index report

# Asks Google which sitemap URLs are indexed (build/gsc_report.py) and commits the answer to seo/.
# Twice a week: one run may inspect 1,900 URLs (API limit 2,000 a day), two runs cover the whole site.
# Needs the repository secret GSC_SERVICE_ACCOUNT. The run fails only on a fault that is new and ours to fix.
on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main  # the newest answers, also for a run that waited behind another; not the commit it was started on
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the site (for its sitemap)
        run: python3 build/build.py
      - name: Ask Google
        id: ask
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          python3 -u build/gsc_report.py   # -u: progress shows in the log while it runs
      - name: Commit the answers
        if: ${{ !cancelled() && hashFiles('seo/index_status.json') != '' }}  # also after a failure or step timeout, never after a cancel
        run: |
          git config user.name "golfvotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seo ":!seo/*.tmp"  # never a half-written .tmp; the report may be missing after a timeout
          git diff --cached --quiet && exit 0
          git commit -qm "Index report"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
