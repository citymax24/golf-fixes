name: Refresh YouTube metadata

on:
  schedule:
    - cron: "17 4 */14 * *"   # every 14 days (YouTube API data must be refreshed within 30 days)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 build/refresh_youtube.py
      - name: Self-host new preview images
        run: |
          pip install -q pillow
          python3 build/build.py
          python3 build/fetch_thumbs.py
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "golfvotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json static/thumbs
          # a push by this workflow does not start the deploy by itself, so it is started here
          git diff --cached --quiet || (git commit -m "Refresh YouTube metadata" && git push && gh workflow run pages.yml --ref main)
