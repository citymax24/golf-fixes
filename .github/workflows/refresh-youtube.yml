name: Refresh YouTube metadata

on:
  schedule:
    - cron: "17 4 */14 * *"   # every 14 days (YouTube API data must be refreshed within 30 days)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 build/refresh_youtube.py
      - name: Commit if changed
        run: |
          git config user.name "golfvotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "Refresh YouTube metadata" && git push)
